name: Harness verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the Harness resolves the workspace packages through their
      # published entry points, so `dist/` must exist before any gate runs.
      - run: pnpm run build
      - run: pnpm run harness:verify
      # The derived schema copies must match schemas/ before anything ships.
      - run: pnpm run schemas:check
      - run: pnpm run verify:examples
      # Documentation is a product surface: every relative link must resolve.
      - run: pnpm run docs:check
      - run: pnpm run release:check
      - run: pnpm run type-check
      - run: pnpm run test:unit
